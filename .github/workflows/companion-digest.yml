name: Companion Digest

on:
  schedule:
    # once a day — this feeds the cached proactive observation the
    # sidebar companion shows on load, not a live call per page view
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the companion digest
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/companion" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"digest"}')
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "HTTP $status"
            exit 1
          fi
