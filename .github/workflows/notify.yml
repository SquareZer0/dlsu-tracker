name: Notify

on:
  schedule:
    # every 15 minutes — needs to be frequent enough to catch the 15-min
    # class-start window; GitHub may delay a few minutes under load
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the notify endpoint
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "HTTP $status"
            exit 1
          fi
