name: Dedupe assignments

on:
  schedule:
    # every 6 hours — duplicates only ever come from a Canvas sync, which
    # isn't frequent enough to need the notify workflow's 15-minute cadence
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the dedupe endpoint
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/dedupe-assignments" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "HTTP $status"
            exit 1
          fi
