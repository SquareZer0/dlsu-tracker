<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
  <!-- faint crossing arcs, evoking a map/compass motif -->
  <g fill="none" stroke="#B0A57D" stroke-width="1.4" opacity="0.28">
    <path d="M -60,420 Q 480,-80 1060,300" />
    <path d="M 120,660 Q 620,320 940,-60" />
    <path d="M -60,40 Q 380,520 1060,480" />
    <path d="M 320,-60 Q 700,280 480,660" />
  </g>

  <!-- dotted border frame -->
  <rect x="18" y="18" width="964" height="564" fill="none" stroke="#B0A57D"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="1.5 26" opacity="0.6" />

  <!-- corner ornaments -->
  <g fill="#B0A57D" opacity="0.65">
    <rect x="12" y="12" width="12" height="12" transform="rotate(45 18 18)" />
    <rect x="976" y="12" width="12" height="12" transform="rotate(45 982 18)" />
    <rect x="12" y="576" width="12" height="12" transform="rotate(45 18 582)" />
    <rect x="976" y="576" width="12" height="12" transform="rotate(45 982 582)" />
  </g>
</svg>
